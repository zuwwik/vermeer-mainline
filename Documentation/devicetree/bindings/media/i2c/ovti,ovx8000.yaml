%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ovx8000.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OVX8000 image sensor

maintainers:
  - azio7 <azio7@outlook.com>

description:
  Fifty megapixel sensor used by the Xiaomi Vermeer main camera module.
  The supported modes output binned RAW10 over three MIPI CSI-2 C-PHY trios
  with a 19.2 MHz external clock. The focus actuator is a separate device.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ovx8000

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active-low sensor reset input.

  avdd-supply:
    description: Analog supply, 2.8 V.

  dvdd-supply:
    description: Digital core supply, 1.104 V on Vermeer.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  afvdd-supply:
    description: Module actuator supply, shared with the focus driver.

  lens-focus: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 1

          data-lanes:
            items:
              - const: 0
              - const: 1
              - const: 2

          link-frequencies:
            items:
              - const: 1348800000

        required:
          - bus-type
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - afvdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "ovti,ovx8000";
            reg = <0x10>;
            clocks = <&camera_clk>;
            reset-gpios = <&gpio 118 GPIO_ACTIVE_LOW>;
            avdd-supply = <&camera_avdd>;
            dvdd-supply = <&camera_dvdd>;
            dovdd-supply = <&camera_dovdd>;
            afvdd-supply = <&camera_afvdd>;

            port {
                endpoint {
                    bus-type = <1>;
                    data-lanes = <0 1 2>;
                    link-frequencies = /bits/ 64 <1348800000>;
                };
            };
        };
    };
