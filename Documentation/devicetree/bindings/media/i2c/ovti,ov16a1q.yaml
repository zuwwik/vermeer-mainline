%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov16a1q.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV16A1Q image sensor

maintainers:
  - azio7 <azio7@outlook.com>

description:
  Sixteen megapixel Bayer sensor with an I2C control interface and four MIPI
  CSI-2 D-PHY data lanes. This driver supports the 19.2 MHz input clock mode.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov16a1q

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  reset-gpios:
    description: Active-low RESETB input.
    maxItems: 1

  avdd-supply:
    description: Analog power supply.

  dvdd-supply:
    description: Digital core power supply.

  dovdd-supply:
    description: Digital I/O power supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies:
            items:
              - const: 696000000

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "ovti,ov16a1q";
            reg = <0x10>;
            clocks = <&camera_clk>;
            reset-gpios = <&gpio 120 GPIO_ACTIVE_LOW>;
            avdd-supply = <&camera_avdd>;
            dvdd-supply = <&camera_dvdd>;
            dovdd-supply = <&camera_dovdd>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <696000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
