%YAML 1.2
---
$id: http://devicetree.org/schemas/input/qcom,pm8550b-haptics.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8550B HAP525 High Voltage Haptics

maintainers:
  - Fenglin Wu <fenglin.wu@oss.qualcomm.com>

description: |
  PM8550B contains a HAP525_HV engine for linear resonant actuators. The
  configuration, pattern/FIFO and boost peripherals share the PMIC regmap.
  XBL supplies actuator resonance and closed-loop brake calibration. FIFO
  waveforms can use resonance-relative rates or fixed PCM sample rates.

properties:
  compatible:
    const: qcom,pm8550b-haptics

  reg:
    items:
      - description: Haptics configuration peripheral
      - description: Pattern and FIFO peripheral
      - description: Haptics boost peripheral

  reg-names:
    items:
      - const: cfg
      - const: ptn
      - const: boost

  interrupts:
    maxItems: 1

  interrupt-names:
    const: fifo-empty

  qcom,vmax-microvolt:
    description: Continuous actuator drive voltage, from the board specification.
    minimum: 50000
    maximum: 10000000
    multipleOf: 50000

  qcom,custom-vmax-microvolt:
    description: |
      Maximum voltage allowed for custom transient waveforms. Defaults to
      qcom,vmax-microvolt. A larger value requires board-specific transient
      actuator qualification.
    minimum: 50000
    maximum: 10000000
    multipleOf: 50000

  qcom,lra-period-us:
    description: Nominal actuator resonance period, used if XBL calibration is invalid.
    minimum: 5
    maximum: 20475
    multipleOf: 5

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - qcom,vmax-microvolt
  - qcom,lra-period-us

additionalProperties: false
